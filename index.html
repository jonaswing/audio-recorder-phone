<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f1115" />
    <title>Audio Recorder</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --border: #2a3140;
        --text: #e8ecf4;
        --muted: #9aa3b5;
        --accent: #3d8bfd;
        --danger: #e35d6a;
        --ok: #3ecf8e;
        --radius: 14px;
        font-family: "Segoe UI", "Cantarell", "Ubuntu", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(1200px 600px at 20% -10%, #1a2438 0%, var(--bg) 55%);
        color: var(--text);
      }
      .app {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 22px 20px 40px;
        max-width: 440px;
        margin: 0 auto;
        min-height: 100%;
      }
      header .brand {
        margin: 0;
        font-size: 1.55rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      header .tagline {
        margin: 6px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .rec-panel {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 88px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .rec-panel.recording {
        border-color: color-mix(in srgb, var(--danger) 55%, var(--border));
        background: linear-gradient(180deg, #1c1520 0%, var(--panel) 100%);
      }
      .rec-idle {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }
      .rec-panel.recording .rec-idle { display: none; }
      .rec-badge {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.45);
        font-variant-numeric: tabular-nums;
        font-size: 1.15rem;
        font-weight: 600;
      }
      .rec-badge.hidden { display: none; }
      .rec-badge .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 0 0 rgba(227, 93, 106, 0.7);
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(227, 93, 106, 0.55); }
        70% { box-shadow: 0 0 0 8px rgba(227, 93, 106, 0); }
        100% { box-shadow: 0 0 0 0 rgba(227, 93, 106, 0); }
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.82rem;
        color: var(--muted);
      }
      input:not([type="range"]), select {
        appearance: none;
        border: 1px solid var(--border);
        background: #10131a;
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.92rem;
      }
      .volume-panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #10131a;
      }
      .volume-title {
        margin: 0;
        font-size: 0.92rem;
        font-weight: 650;
        color: var(--text);
      }
      .volume-row {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.82rem;
        color: var(--muted);
      }
      .volume-head span {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .volume-row strong {
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }
      .volume-row input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 28px;
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        cursor: pointer;
      }
      .volume-row input[type="range"]::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 999px;
        background: #2a3140;
      }
      .volume-row input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 18px;
        height: 18px;
        margin-top: -6px;
        border-radius: 50%;
        background: var(--accent);
        border: 2px solid #e8ecf4;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
      }
      .volume-row input[type="range"]::-moz-range-track {
        height: 6px;
        border-radius: 999px;
        background: #2a3140;
        border: 0;
      }
      .volume-row input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        border: 2px solid #e8ecf4;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45);
      }
      .meter {
        position: relative;
        height: 10px;
        border-radius: 4px;
        background: #0a0c10;
        border: 1px solid #2a3140;
        overflow: hidden;
      }
      .meter-fill {
        height: 100%;
        width: var(--level, 0%);
        border-radius: 3px;
        background: linear-gradient(90deg, #2ecc71 0%, #2ecc71 70%, #f1c40f 85%, #e74c3c 100%);
        transition: width 0.05s linear;
      }
      .meter-peak {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        left: var(--peak, 0%);
        background: #fff;
        opacity: 0.85;
        pointer-events: none;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 4px;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        color: white;
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.primary { background: linear-gradient(180deg, #4b97ff, var(--accent)); }
      button.danger { background: linear-gradient(180deg, #ef7380, var(--danger)); }
      button.secondary {
        width: 100%;
        margin-top: 2px;
        background: #1a2130;
        border: 1px solid var(--border);
        color: var(--text);
      }
      .status {
        margin: 2px 0 0;
        min-height: 1.3em;
        color: var(--muted);
        font-size: 0.88rem;
      }
      .status.ok { color: var(--ok); }
      .status.error { color: #ff8f9a; }
      .hint {
        margin: -4px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.35;
      }
      .panel-title {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 650;
      }
      ul.phone-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      li.item {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        font-size: 0.85rem;
        color: var(--muted);
      }
      li.item:first-child { border-top: 0; padding-top: 0; }
      li.item .meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      li.item strong { color: var(--text); font-weight: 600; }
      li.item button {
        padding: 8px 12px;
        font-size: 0.85rem;
        width: auto;
        align-self: flex-start;
        margin: 0;
      }
      audio { width: 100%; height: 40px; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <p class="brand">Audio Recorder</p>
        <p class="tagline">Record on your phone · save an MP4</p>
      </header>

      <section id="recPanel" class="rec-panel">
        <div id="recBadge" class="rec-badge hidden">
          <span class="dot"></span>
          <span id="timer">00:00</span>
        </div>
        <p class="rec-idle" id="recIdle">Ready to record</p>
      </section>

      <section id="recCard" class="controls">
        <label>
          Microphone
          <select id="micSelect"></select>
        </label>

        <div class="volume-panel">
          <p class="volume-title">Volume controls</p>
          <p id="volumeHint" class="hint">Device audio is recorded in stereo. When asked, share the whole screen and turn on system audio.</p>
          <div class="volume-row">
            <div class="volume-head">
              <span>Mic <strong id="micVolLabel">100%</strong></span>
            </div>
            <div class="meter" aria-hidden="true">
              <div id="micMeterFill" class="meter-fill"></div>
              <div id="micMeterPeak" class="meter-peak"></div>
            </div>
            <input id="micVolume" type="range" min="0" max="400" value="100" step="1" />
          </div>
          <div class="volume-row" id="deviceRow">
            <div class="volume-head">
              <span>Device audio <strong id="desktopVolLabel">100%</strong></span>
            </div>
            <div class="meter" aria-hidden="true">
              <div id="desktopMeterFill" class="meter-fill"></div>
              <div id="desktopMeterPeak" class="meter-peak"></div>
            </div>
            <input id="desktopVolume" type="range" min="0" max="400" value="100" step="1" />
          </div>
        </div>

        <div class="actions">
          <button id="startBtn" class="primary" type="button">Start recording</button>
          <button id="stopBtn" class="danger" type="button" disabled>Stop</button>
        </div>
        <p class="status" id="recStatus">Ready.</p>
      </section>

      <section id="listCard" class="controls">
        <p class="panel-title">On this phone</p>
        <ul id="list" class="phone-list"></ul>
      </section>
    </div>

    <script type="module">
      const micSelect = document.getElementById("micSelect");
      const micVolume = document.getElementById("micVolume");
      const desktopVolume = document.getElementById("desktopVolume");
      const micVolLabel = document.getElementById("micVolLabel");
      const desktopVolLabel = document.getElementById("desktopVolLabel");
      const micMeterFill = document.getElementById("micMeterFill");
      const micMeterPeak = document.getElementById("micMeterPeak");
      const desktopMeterFill = document.getElementById("desktopMeterFill");
      const desktopMeterPeak = document.getElementById("desktopMeterPeak");
      const volumeHint = document.getElementById("volumeHint");
      const recPanel = document.getElementById("recPanel");
      const recBadge = document.getElementById("recBadge");
      const recStatus = document.getElementById("recStatus");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const timerEl = document.getElementById("timer");
      const listEl = document.getElementById("list");

      let mediaRecorder = null;
      let chunks = [];
      let timer = null;
      let startedAt = 0;
      let audioContext = null;
      let micVolumeGain = null;
      let desktopVolumeGain = null;
      let micAnalyser = null;
      let desktopAnalyser = null;
      let meterRaf = null;
      let captureStreams = [];
      const micPeakState = { value: 0, hold: 0 };
      const desktopPeakState = { value: 0, hold: 0 };
      const recordings = [];
      const canDisplayMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const isPhone = isIOS || /Android|Mobile/i.test(navigator.userAgent);

      function setText(msg, kind) {
        recStatus.textContent = msg;
        recStatus.className = "status " + (kind || "");
      }

      function fmt(ms) {
        const s = Math.floor(ms / 1000);
        return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      }

      function stamp() {
        const d = new Date();
        const p = (n) => String(n).padStart(2, "0");
        return (
          d.getFullYear() +
          "-" +
          p(d.getMonth() + 1) +
          "-" +
          p(d.getDate()) +
          "-" +
          p(d.getHours()) +
          p(d.getMinutes()) +
          p(d.getSeconds())
        );
      }

      function sliderToGain(el) {
        return Number(el.value) / 100;
      }

      function syncVolumeLabels() {
        micVolLabel.textContent = micVolume.value + "%";
        desktopVolLabel.textContent = desktopVolume.value + "%";
      }

      function applyLiveVolumes() {
        syncVolumeLabels();
        const now = audioContext ? audioContext.currentTime : 0;
        if (micVolumeGain && audioContext) {
          micVolumeGain.gain.setTargetAtTime(sliderToGain(micVolume), now, 0.03);
        }
        if (desktopVolumeGain && audioContext) {
          desktopVolumeGain.gain.setTargetAtTime(sliderToGain(desktopVolume), now, 0.03);
        }
      }

      micVolume.addEventListener("input", applyLiveVolumes);
      desktopVolume.addEventListener("input", applyLiveVolumes);
      syncVolumeLabels();
      if (isPhone) {
        document.getElementById("deviceRow").classList.add("hidden");
        volumeHint.textContent = "Records the phone microphone and saves an MP4 on this phone.";
      } else if (!canDisplayMedia) {
        desktopVolume.disabled = true;
        volumeHint.textContent = "This browser cannot capture stereo device audio. Use desktop Chrome or Edge.";
      }

      function getAnalyserLevel(analyser) {
        if (!analyser) return 0;
        const data = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) {
          const v = (data[i] - 128) / 128;
          sum += v * v;
        }
        return Math.min(1, Math.sqrt(sum / data.length) * 3.2);
      }

      function setMeter(fillEl, peakEl, level, peakState) {
        const pct = Math.round(level * 100);
        if (level >= peakState.value) {
          peakState.value = level;
          peakState.hold = 18;
        } else if (peakState.hold > 0) {
          peakState.hold -= 1;
        } else {
          peakState.value = Math.max(0, peakState.value - 0.02);
        }
        fillEl.style.setProperty("--level", pct + "%");
        peakEl.style.setProperty("--peak", Math.round(peakState.value * 100) + "%");
        peakEl.style.opacity = peakState.value > 0.02 ? "0.9" : "0";
      }

      function stopMeters() {
        if (meterRaf) cancelAnimationFrame(meterRaf);
        meterRaf = null;
        micMeterFill.style.setProperty("--level", "0%");
        desktopMeterFill.style.setProperty("--level", "0%");
        micMeterPeak.style.setProperty("--peak", "0%");
        desktopMeterPeak.style.setProperty("--peak", "0%");
        micMeterPeak.style.opacity = "0";
        desktopMeterPeak.style.opacity = "0";
        micPeakState.value = 0;
        desktopPeakState.value = 0;
      }

      function startMeters() {
        stopMeters();
        const tick = () => {
          setMeter(micMeterFill, micMeterPeak, getAnalyserLevel(micAnalyser), micPeakState);
          setMeter(desktopMeterFill, desktopMeterPeak, getAnalyserLevel(desktopAnalyser), desktopPeakState);
          meterRaf = requestAnimationFrame(tick);
        };
        meterRaf = requestAnimationFrame(tick);
      }

      function pickMime() {
        const types = isPhone
          ? ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"]
          : ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
        return types.find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
      }

      async function loadMics() {
        try {
          const temp = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          temp.getTracks().forEach((t) => t.stop());
        } catch {
          // list whatever is already permitted
        }
        const devices = await navigator.mediaDevices.enumerateDevices();
        const mics = devices.filter((d) => d.kind === "audioinput");
        const earpiece = mics.find((m) => isHeadsetEarpiece(m.label));
        const ordered = earpiece ? [earpiece, ...mics.filter((m) => m !== earpiece)] : mics;
        micSelect.innerHTML = "";
        for (const mic of ordered) {
          const opt = document.createElement("option");
          opt.value = mic.deviceId;
          opt.textContent = mic.label || "Microphone";
          if (mic === earpiece) opt.selected = true;
          micSelect.appendChild(opt);
        }
        if (!mics.length) {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "Default microphone";
          micSelect.appendChild(opt);
        }
        if (earpiece) micSelect.value = earpiece.deviceId;
      }

      function isHeadsetEarpiece(label) {
        const name = (label || "").toLowerCase().replace(/[^a-z]+/g, " ");
        return name.includes("headset") && name.includes("earpiece");
      }

      async function openMic() {
        const deviceId = micSelect.value ? { exact: micSelect.value } : undefined;
        const attempts = [
          {
            deviceId,
            echoCancellation: { exact: false },
            noiseSuppression: { exact: false },
            autoGainControl: { exact: false },
            voiceIsolation: { exact: false },
            channelCount: { ideal: 1 },
            sampleRate: { ideal: 48000 },
            sampleSize: { ideal: 16 },
          },
          {
            deviceId,
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            channelCount: { ideal: 1 },
            sampleRate: { ideal: 48000 },
          },
        ];
        let lastErr = null;
        for (const audio of attempts) {
          try {
            return await navigator.mediaDevices.getUserMedia({ audio, video: false });
          } catch (err) {
            lastErr = err;
            if (err.name !== "OverconstrainedError" && err.name !== "ConstraintError") throw err;
          }
        }
        throw lastErr || new Error("Could not open the microphone");
      }

      async function getSystemAudioStream() {
        const displayStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 5, width: 320, height: 180 },
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            channelCount: { ideal: 2 },
            sampleRate: { ideal: 48000 },
            suppressLocalAudioPlayback: false,
          },
          systemAudio: "include",
        });
        const audio = displayStream.getAudioTracks()[0];
        if (!audio) {
          displayStream.getTracks().forEach((t) => t.stop());
          throw new Error("No device audio was shared. Turn on system audio for the whole screen.");
        }
        try { audio.contentHint = "music"; } catch { /* ignore */ }
        return displayStream;
      }

      function cleanupCapture() {
        stopMeters();
        if (timer) clearInterval(timer);
        timer = null;
        for (const stream of captureStreams) stream.getTracks().forEach((t) => t.stop());
        captureStreams = [];
        if (audioContext) {
          audioContext.close().catch(() => {});
          audioContext = null;
        }
        micVolumeGain = null;
        desktopVolumeGain = null;
        micAnalyser = null;
        desktopAnalyser = null;
        mediaRecorder = null;
        recPanel.classList.remove("recording");
        recBadge.classList.add("hidden");
        startBtn.disabled = false;
        stopBtn.disabled = true;
        micSelect.disabled = false;
      }

      async function toMp4(blob) {
        const mediabunny = await import("https://cdn.jsdelivr.net/npm/mediabunny@1.61.1/+esm");
        const aac = await import("https://cdn.jsdelivr.net/npm/@mediabunny/aac-encoder@1.61.1/+esm");
        aac.registerAacEncoder();

        const attempts = [
          {
            codec: "aac",
            numberOfChannels: 2,
            sampleRate: 48000,
            quality: new mediabunny.Quality({ bitrate: 256000 }),
          },
          {
            codec: "aac",
            numberOfChannels: 2,
            quality: new mediabunny.Quality("high"),
          },
          { codec: "aac" },
        ];

        for (const audio of attempts) {
          const input = new mediabunny.Input({
            source: new mediabunny.BlobSource(blob),
            formats: mediabunny.ALL_FORMATS,
          });
          const output = new mediabunny.Output({
            format: new mediabunny.Mp4OutputFormat(),
            target: new mediabunny.BufferTarget(),
          });
          const conversion = await mediabunny.Conversion.init({ input, output, audio });
          if (!conversion.isValid) continue;
          await conversion.execute();
          return new Blob([output.target.buffer], { type: "audio/mp4" });
        }
        throw new Error("This browser could not write an MP4.");
      }

      async function saveFile(blob, filename) {
        const file = new File([blob], filename, { type: "audio/mp4" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: filename });
          return;
        }
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
      }

      function renderList() {
        listEl.innerHTML = "";
        if (!recordings.length) {
          const li = document.createElement("li");
          li.className = "item";
          li.textContent = "No recordings yet.";
          listEl.appendChild(li);
          return;
        }
        for (const item of recordings) {
          const li = document.createElement("li");
          li.className = "item";
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.innerHTML = "<strong>" + item.name + "</strong><span>" + item.when + "</span>";
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.setAttribute("playsinline", "");
          audio.src = item.url;
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "secondary";
          btn.textContent = "Save MP4";
          btn.onclick = async () => {
            try {
              await saveFile(item.blob, item.name);
              setText("Saved " + item.name, "ok");
            } catch (err) {
              if (err && err.name === "AbortError") return;
              setText(err.message || String(err), "error");
            }
          };
          li.append(meta, audio, btn);
          listEl.appendChild(li);
        }
      }

      stopBtn.onclick = () => {
        if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      };

      startBtn.onclick = async () => {
        if (mediaRecorder) return;
        try {
          startBtn.disabled = true;
          setText("Starting…");
          const micStream = await openMic();
          captureStreams.push(micStream);

          let systemStream = null;
          if (!isPhone && canDisplayMedia && !desktopVolume.disabled) {
            try {
              setText("Share audio if you want device sound…");
              systemStream = await getSystemAudioStream();
              captureStreams.push(systemStream);
            } catch (err) {
              console.warn(err);
            }
          }

          audioContext = new AudioContext();
          await audioContext.resume();
          const micSource = audioContext.createMediaStreamSource(micStream);
          micVolumeGain = audioContext.createGain();
          micVolumeGain.gain.value = sliderToGain(micVolume);
          micSource.connect(micVolumeGain);
          micAnalyser = audioContext.createAnalyser();
          micAnalyser.fftSize = 2048;
          micVolumeGain.connect(micAnalyser);

          let recordStream = micStream;
          if (!isPhone) {
            const dest = audioContext.createMediaStreamDestination();
            dest.channelCount = 2;
            dest.channelCountMode = "explicit";
            dest.channelInterpretation = "discrete";
            micVolumeGain.connect(dest);
            if (systemStream) {
              const deskSource = audioContext.createMediaStreamSource(systemStream);
              deskSource.channelCount = 2;
              deskSource.channelCountMode = "explicit";
              deskSource.channelInterpretation = "discrete";
              desktopVolumeGain = audioContext.createGain();
              desktopVolumeGain.channelCount = 2;
              desktopVolumeGain.channelCountMode = "explicit";
              desktopVolumeGain.channelInterpretation = "discrete";
              desktopVolumeGain.gain.value = sliderToGain(desktopVolume);
              deskSource.connect(desktopVolumeGain);
              desktopAnalyser = audioContext.createAnalyser();
              desktopAnalyser.fftSize = 2048;
              desktopVolumeGain.connect(desktopAnalyser);
              desktopVolumeGain.connect(dest);
            }
            recordStream = dest.stream;
          }

          chunks = [];
          const mime = pickMime();
          const recorderOptions = {};
          if (mime) recorderOptions.mimeType = mime;
          if (!isPhone) recorderOptions.audioBitsPerSecond = 512000;
          else if (mime.includes("mp4")) recorderOptions.audioBitsPerSecond = 256000;
          mediaRecorder = new MediaRecorder(recordStream, Object.keys(recorderOptions).length ? recorderOptions : undefined);
          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size) chunks.push(e.data);
          };
          mediaRecorder.onstop = async () => {
            const raw = new Blob(chunks, { type: mediaRecorder?.mimeType || mime || "audio/webm" });
            cleanupCapture();
            if (!raw.size) {
              setText("Recording was empty.", "error");
              return;
            }
            const alreadyMp4 = (raw.type || mime || "").includes("mp4");
            setText(alreadyMp4 ? "Saving…" : "Making MP4…");
            try {
              const mp4 = alreadyMp4 ? new Blob([raw], { type: "audio/mp4" }) : await toMp4(raw);
              const name = "recording-" + stamp() + ".mp4";
              const url = URL.createObjectURL(mp4);
              recordings.unshift({ name, blob: mp4, url, when: new Date().toLocaleString() });
              renderList();
              setText("MP4 ready. Tap Save MP4 to keep it on your phone.", "ok");
            } catch (err) {
              setText(err.message || String(err), "error");
            }
          };
          if (isPhone) mediaRecorder.start();
          else mediaRecorder.start(1000);
          startedAt = Date.now();
          timerEl.textContent = "00:00";
          recBadge.classList.remove("hidden");
          recPanel.classList.add("recording");
          stopBtn.disabled = false;
          micSelect.disabled = true;
          startMeters();
          timer = setInterval(() => {
            timerEl.textContent = fmt(Date.now() - startedAt);
          }, 250);
          setText(systemStream ? "Recording mic + device audio." : "Recording.", "ok");
        } catch (err) {
          cleanupCapture();
          setText(err.message, "error");
        }
      };

      renderList();
      loadMics().catch((err) => setText(err.message, "error"));
    </script>
  </body>
</html>
