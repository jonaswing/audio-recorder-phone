<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f1115" />
    <title>Audio Recorder</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --border: #2a3140;
        --text: #e8ecf4;
        --muted: #9aa3b5;
        --accent: #3d8bfd;
        --danger: #e35d6a;
        --ok: #3ecf8e;
        --radius: 14px;
        font-family: "Segoe UI", "Cantarell", "Ubuntu", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(1200px 600px at 20% -10%, #1a2438 0%, var(--bg) 55%);
        color: var(--text);
      }
      .app {
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 22px 20px 40px;
        max-width: 440px;
        margin: 0 auto;
        min-height: 100%;
      }
      header .brand {
        margin: 0;
        font-size: 1.55rem;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .rec-panel {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 88px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      .rec-panel.recording {
        border-color: color-mix(in srgb, var(--danger) 55%, var(--border));
        background: linear-gradient(180deg, #1c1520 0%, var(--panel) 100%);
      }
      .rec-badge {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.45);
        font-variant-numeric: tabular-nums;
        font-size: 1.15rem;
        font-weight: 600;
      }
      .rec-badge .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 0 0 rgba(227, 93, 106, 0.7);
        animation: pulse 1.2s infinite;
      }
      @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(227, 93, 106, 0.55); }
        70% { box-shadow: 0 0 0 8px rgba(227, 93, 106, 0); }
        100% { box-shadow: 0 0 0 0 rgba(227, 93, 106, 0); }
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.82rem;
        color: var(--muted);
      }
      select {
        appearance: none;
        border: 1px solid var(--border);
        background: #10131a;
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.92rem;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 4px;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        color: white;
      }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.primary { background: linear-gradient(180deg, #4b97ff, var(--accent)); }
      button.danger { background: linear-gradient(180deg, #ef7380, var(--danger)); }
      button.secondary {
        width: 100%;
        margin-top: 2px;
        background: #1a2130;
        border: 1px solid var(--border);
        color: var(--text);
      }
      .status {
        margin: 2px 0 0;
        min-height: 1.3em;
        color: var(--muted);
        font-size: 0.88rem;
      }
      .status.ok { color: var(--ok); }
      .status.error { color: #ff8f9a; }
      .panel-title {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 650;
      }
      ul.phone-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      li.item {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        font-size: 0.85rem;
        color: var(--muted);
      }
      li.item:first-child { border-top: 0; padding-top: 0; }
      li.item .meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
      }
      li.item strong { color: var(--text); font-weight: 600; }
      li.item button,
      li.item a.save {
        padding: 8px 12px;
        font-size: 0.85rem;
        width: auto;
        align-self: flex-start;
        margin: 0;
        border-radius: 12px;
        font-weight: 600;
        text-decoration: none;
        background: #1a2130;
        border: 1px solid var(--border);
        color: var(--text);
      }
      audio { width: 100%; height: 40px; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <p class="brand">Audio Recorder</p>
      </header>

      <section id="recPanel" class="rec-panel hidden">
        <div id="recBadge" class="rec-badge">
          <span class="dot"></span>
          <span id="timer">00:00</span>
        </div>
      </section>

      <section id="recCard" class="controls">
        <label>
          Microphone
          <select id="micSelect"></select>
        </label>

        <div class="actions">
          <button id="startBtn" class="primary" type="button">Start recording</button>
          <button id="stopBtn" class="danger" type="button" disabled>Stop</button>
        </div>
        <p class="status" id="recStatus">Ready.</p>
      </section>

      <section id="listCard" class="controls">
        <p class="panel-title">On this phone</p>
        <ul id="list" class="phone-list"></ul>
      </section>
    </div>

    <script type="module">
      const micSelect = document.getElementById("micSelect");
      const recPanel = document.getElementById("recPanel");
      const recStatus = document.getElementById("recStatus");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const timerEl = document.getElementById("timer");
      const listEl = document.getElementById("list");

      let mediaRecorder = null;
      let chunks = [];
      let timer = null;
      let startedAt = 0;
      let audioContext = null;
      let captureStreams = [];
      const recordings = [];
      const canDisplayMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const isPhone = isIOS || /Android|Mobile/i.test(navigator.userAgent);

      function setText(msg, kind) {
        recStatus.textContent = msg;
        recStatus.className = "status " + (kind || "");
      }

      function fmt(ms) {
        const s = Math.floor(ms / 1000);
        return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      }

      function stamp() {
        const d = new Date();
        const p = (n) => String(n).padStart(2, "0");
        return (
          d.getFullYear() +
          "-" +
          p(d.getMonth() + 1) +
          "-" +
          p(d.getDate()) +
          "-" +
          p(d.getHours()) +
          p(d.getMinutes()) +
          p(d.getSeconds())
        );
      }

      function pickMime() {
        const types = isPhone
          ? ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"]
          : ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
        return types.find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
      }

      async function loadMics() {
        try {
          const temp = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          temp.getTracks().forEach((t) => t.stop());
        } catch {
          // list whatever is already permitted
        }
        const devices = await navigator.mediaDevices.enumerateDevices();
        const mics = devices.filter((d) => d.kind === "audioinput");
        const earpiece = mics.find((m) => isHeadsetEarpiece(m.label));
        const ordered = earpiece ? [earpiece, ...mics.filter((m) => m !== earpiece)] : mics;
        micSelect.innerHTML = "";
        for (const mic of ordered) {
          const opt = document.createElement("option");
          opt.value = mic.deviceId;
          opt.textContent = mic.label || "Microphone";
          if (mic === earpiece) opt.selected = true;
          micSelect.appendChild(opt);
        }
        if (!mics.length) {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "Default microphone";
          micSelect.appendChild(opt);
        }
        if (earpiece) micSelect.value = earpiece.deviceId;
      }

      function isHeadsetEarpiece(label) {
        const name = (label || "").toLowerCase().replace(/[^a-z]+/g, " ");
        return name.includes("headset") && name.includes("earpiece");
      }

      async function openMic() {
        const deviceId = micSelect.value ? { exact: micSelect.value } : undefined;
        const attempts = [
          {
            deviceId,
            echoCancellation: { exact: false },
            noiseSuppression: { exact: false },
            autoGainControl: { exact: false },
            voiceIsolation: { exact: false },
            channelCount: { ideal: 1 },
            sampleRate: { ideal: 48000 },
            sampleSize: { ideal: 16 },
          },
          {
            deviceId,
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            channelCount: { ideal: 1 },
            sampleRate: { ideal: 48000 },
          },
        ];
        let lastErr = null;
        for (const audio of attempts) {
          try {
            return await navigator.mediaDevices.getUserMedia({ audio, video: false });
          } catch (err) {
            lastErr = err;
            if (err.name !== "OverconstrainedError" && err.name !== "ConstraintError") throw err;
          }
        }
        throw lastErr || new Error("Could not open the microphone");
      }

      async function getSystemAudioStream() {
        const displayStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 5, width: 320, height: 180 },
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            channelCount: { ideal: 2 },
            sampleRate: { ideal: 48000 },
            suppressLocalAudioPlayback: false,
          },
          systemAudio: "include",
        });
        const audio = displayStream.getAudioTracks()[0];
        if (!audio) {
          displayStream.getTracks().forEach((t) => t.stop());
          throw new Error("No device audio was shared. Turn on system audio for the whole screen.");
        }
        try { audio.contentHint = "music"; } catch { /* ignore */ }
        return displayStream;
      }

      function cleanupCapture() {
        if (timer) clearInterval(timer);
        timer = null;
        for (const stream of captureStreams) stream.getTracks().forEach((t) => t.stop());
        captureStreams = [];
        if (audioContext) {
          audioContext.close().catch(() => {});
          audioContext = null;
        }
        mediaRecorder = null;
        recPanel.classList.remove("recording");
        recPanel.classList.add("hidden");
        startBtn.disabled = false;
        stopBtn.disabled = true;
        micSelect.disabled = false;
      }

      async function toMp4(blob) {
        const mediabunny = await import("https://cdn.jsdelivr.net/npm/mediabunny@1.61.1/+esm");
        const aac = await import("https://cdn.jsdelivr.net/npm/@mediabunny/aac-encoder@1.61.1/+esm");
        aac.registerAacEncoder();

        const attempts = [
          {
            codec: "aac",
            numberOfChannels: 2,
            sampleRate: 48000,
            quality: new mediabunny.Quality({ bitrate: 256000 }),
          },
          {
            codec: "aac",
            numberOfChannels: 2,
            quality: new mediabunny.Quality("high"),
          },
          { codec: "aac" },
        ];

        for (const audio of attempts) {
          const input = new mediabunny.Input({
            source: new mediabunny.BlobSource(blob),
            formats: mediabunny.ALL_FORMATS,
          });
          const output = new mediabunny.Output({
            format: new mediabunny.Mp4OutputFormat(),
            target: new mediabunny.BufferTarget(),
          });
          const conversion = await mediabunny.Conversion.init({ input, output, audio });
          if (!conversion.isValid) continue;
          await conversion.execute();
          return new Blob([output.target.buffer], { type: "audio/mp4" });
        }
        throw new Error("This browser could not write an MP4.");
      }

      async function ensureVideoMp4(blob) {
        const mediabunny = await import("https://cdn.jsdelivr.net/npm/mediabunny@1.61.1/+esm");
        const aac = await import("https://cdn.jsdelivr.net/npm/@mediabunny/aac-encoder@1.61.1/+esm");
        aac.registerAacEncoder();

        const audioCtx = new AudioContext();
        let audioBuffer;
        try {
          audioBuffer = await audioCtx.decodeAudioData(await blob.arrayBuffer());
        } finally {
          audioCtx.close().catch(() => {});
        }
        const duration = Math.max(audioBuffer.duration || 0, 0.05);
        const canvas = document.createElement("canvas");
        canvas.width = 160;
        canvas.height = 160;
        const ctx = canvas.getContext("2d", { alpha: false });
        ctx.fillStyle = "#10131a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const output = new mediabunny.Output({
          format: new mediabunny.Mp4OutputFormat({ fastStart: "in-memory" }),
          target: new mediabunny.BufferTarget(),
        });
        const canvasSource = new mediabunny.CanvasSource(canvas, {
          codec: "avc",
          bitrate: new mediabunny.Quality("low"),
        });
        const audioSource = new mediabunny.AudioBufferSource({
          codec: "aac",
          bitrate: new mediabunny.Quality({ bitrate: 256000 }),
        });
        output.addVideoTrack(canvasSource);
        output.addAudioTrack(audioSource);
        await output.start();
        await canvasSource.add(0, duration);
        await audioSource.add(audioBuffer);
        await output.finalize();
        return new Blob([output.target.buffer], { type: "video/mp4" });
      }

      function renderList() {
        listEl.innerHTML = "";
        if (!recordings.length) {
          const li = document.createElement("li");
          li.className = "item";
          li.textContent = "No recordings yet.";
          listEl.appendChild(li);
          return;
        }
        for (const item of recordings) {
          const li = document.createElement("li");
          li.className = "item";
          const meta = document.createElement("div");
          meta.className = "meta";
          meta.innerHTML = "<strong>" + item.name + "</strong><span>" + item.when + "</span>";
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.setAttribute("playsinline", "");
          audio.src = item.url;
          const save = document.createElement("a");
          save.className = "save";
          save.href = URL.createObjectURL(new Blob([item.blob], { type: "application/octet-stream" }));
          save.download = item.name;
          save.textContent = "Download MP4";
          save.addEventListener("click", () => setText("Downloading " + item.name + " to your phone…", "ok"));
          li.append(meta, audio, save);
          listEl.appendChild(li);
        }
      }

      stopBtn.onclick = () => {
        if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
      };

      startBtn.onclick = async () => {
        if (mediaRecorder) return;
        try {
          startBtn.disabled = true;
          setText("Starting…");
          const micStream = await openMic();
          captureStreams.push(micStream);

          let systemStream = null;
          if (!isPhone && canDisplayMedia) {
            try {
              setText("Share audio if you want device sound…");
              systemStream = await getSystemAudioStream();
              captureStreams.push(systemStream);
            } catch (err) {
              console.warn(err);
            }
          }

          let recordStream = micStream;
          if (!isPhone) {
            audioContext = new AudioContext();
            await audioContext.resume();
            const dest = audioContext.createMediaStreamDestination();
            dest.channelCount = 2;
            dest.channelCountMode = "explicit";
            dest.channelInterpretation = "discrete";
            const micSource = audioContext.createMediaStreamSource(micStream);
            micSource.connect(dest);
            if (systemStream) {
              const deskSource = audioContext.createMediaStreamSource(systemStream);
              deskSource.channelCount = 2;
              deskSource.channelCountMode = "explicit";
              deskSource.channelInterpretation = "discrete";
              deskSource.connect(dest);
            }
            recordStream = dest.stream;
          }

          chunks = [];
          const mime = pickMime();
          const recorderOptions = {};
          if (mime) recorderOptions.mimeType = mime;
          if (!isPhone) recorderOptions.audioBitsPerSecond = 512000;
          else if (mime.includes("mp4")) recorderOptions.audioBitsPerSecond = 256000;
          mediaRecorder = new MediaRecorder(recordStream, Object.keys(recorderOptions).length ? recorderOptions : undefined);
          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size) chunks.push(e.data);
          };
          mediaRecorder.onstop = async () => {
            const raw = new Blob(chunks, { type: mediaRecorder?.mimeType || mime || "audio/webm" });
            cleanupCapture();
            if (!raw.size) {
              setText("Recording was empty.", "error");
              return;
            }
            const alreadyMp4 = (raw.type || mime || "").includes("mp4");
            setText("Making MP4…");
            try {
              const mp4 = isPhone
                ? await ensureVideoMp4(raw)
                : (alreadyMp4 ? new Blob([raw], { type: "audio/mp4" }) : await toMp4(raw));
              const name = "recording-" + stamp() + ".mp4";
              const url = URL.createObjectURL(mp4);
              recordings.unshift({ name, blob: mp4, url, when: new Date().toLocaleString() });
              renderList();
              setText("MP4 ready. Tap Download MP4 to keep it on your phone.", "ok");
            } catch (err) {
              setText(err.message || String(err), "error");
            }
          };
          if (isPhone) mediaRecorder.start();
          else mediaRecorder.start(1000);
          startedAt = Date.now();
          timerEl.textContent = "00:00";
          recPanel.classList.remove("hidden");
          recPanel.classList.add("recording");
          stopBtn.disabled = false;
          micSelect.disabled = true;
          timer = setInterval(() => {
            timerEl.textContent = fmt(Date.now() - startedAt);
          }, 250);
          setText(systemStream ? "Recording mic + device audio." : "Recording.", "ok");
        } catch (err) {
          cleanupCapture();
          setText(err.message, "error");
        }
      };

      renderList();
      loadMics().catch((err) => setText(err.message, "error"));
    </script>
  </body>
</html>
