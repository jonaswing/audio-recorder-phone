<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0f1115" />
    <title>Audio Recorder</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --border: #2a3140;
        --text: #e8ecf4;
        --muted: #9aa3b5;
        --accent: #3d8bfd;
        --danger: #e35d6a;
        --ok: #3ecf8e;
        --radius: 14px;
        font-family: "Segoe UI", "Cantarell", "Ubuntu", -apple-system, BlinkMacSystemFont, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(1200px 600px at 20% -10%, #1a2438 0%, var(--bg) 55%);
        color: var(--text);
      }
      .app {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 22px 20px 40px;
        max-width: 440px;
        margin: 0 auto;
        min-height: 100%;
      }
      .more-btn {
        position: absolute;
        top: 8px;
        right: 8px;
        z-index: 3;
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 50%;
        padding: 0;
        display: grid;
        place-items: center;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .more-btn svg { width: 22px; height: 22px; }
      .more-btn[aria-expanded="true"],
      .more-btn:hover { background: rgba(255, 255, 255, 0.06); color: var(--text); }
      .more-btn:disabled { opacity: 0.35; cursor: default; }
      .mic-menu {
        position: absolute;
        top: 52px;
        right: 12px;
        z-index: 4;
        width: min(280px, calc(100% - 24px));
        padding: 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      }
      .record-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 4px 0 0;
      }
      .record-time {
        margin: 0;
        height: 1.4em;
        line-height: 1.4em;
        font-variant-numeric: tabular-nums;
        font-size: 1.35rem;
        font-weight: 650;
        letter-spacing: 0.04em;
      }
      .record-btn {
        width: 118px;
        height: 118px;
        border: 0;
        border-radius: 50%;
        padding: 0;
        display: grid;
        place-items: center;
        color: white;
        background: radial-gradient(circle at 35% 28%, #ff8b94, #e03545 58%, #b42332);
        box-shadow: 0 12px 32px rgba(224, 53, 69, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.28);
        cursor: pointer;
        position: relative;
      }
      .record-btn svg {
        width: 52px;
        height: 52px;
      }
      .record-btn .icon-stop { display: none; }
      .record-btn.recording .icon-mic { display: none; }
      .record-btn.recording .icon-stop { display: block; }
      .record-btn.recording::before {
        content: "";
        position: absolute;
        inset: -12px;
        border-radius: 50%;
        border: 2px solid rgba(227, 93, 106, 0.55);
        animation: record-ring 1.5s ease-out infinite;
      }
      @keyframes record-ring {
        0% { transform: scale(0.94); opacity: 0.85; }
        100% { transform: scale(1.14); opacity: 0; }
      }
      .record-btn:disabled { opacity: 0.55; cursor: wait; }
      .record-hint {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
      }
      .controls {
        display: flex;
        flex-direction: column;
        gap: 12px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 0.82rem;
        color: var(--muted);
      }
      select {
        appearance: none;
        border: 1px solid var(--border);
        background: #10131a;
        color: var(--text);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.92rem;
      }
      .wave {
        align-self: stretch;
        width: 100%;
        height: 84px;
        display: block;
      }
      .status {
        margin: 0;
        height: 2.7em;
        line-height: 1.35;
        overflow: hidden;
        text-align: center;
        color: var(--muted);
        font-size: 0.88rem;
      }
      .status.ok { color: var(--ok); }
      .status.error { color: #ff8f9a; }
      .panel-title {
        margin: 0;
        font-size: 0.95rem;
        font-weight: 500;
      }
      .clips {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      ul.phone-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      li.item {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: color-mix(in srgb, var(--panel) 88%, transparent);
      }
      li.item.empty {
        color: var(--muted);
        text-align: center;
        font-size: 0.9rem;
      }
      .clip-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .clip-titles { min-width: 0; }
      .clip-title {
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
        font-size: 1.02rem;
        font-weight: 650;
      }
      .clip-sub {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 0.78rem;
      }
      .clip-actions {
        display: flex;
        flex-shrink: 0;
        gap: 8px;
      }
      .clip-save,
      .clip-delete {
        padding: 8px 12px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: #10131a;
        color: var(--text);
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 650;
        cursor: pointer;
      }
      .clip-delete {
        width: 36px;
        height: 36px;
        padding: 0;
        display: grid;
        place-items: center;
        background: transparent;
        border-color: color-mix(in srgb, var(--danger) 55%, var(--border));
        color: #ff8f9a;
      }
      .clip-delete svg { width: 18px; height: 18px; }
      .confirm-overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 24px;
        background: rgba(6, 8, 12, 0.72);
      }
      .confirm-card {
        width: min(100%, 300px);
        padding: 22px 18px 16px;
        border-radius: 18px;
        background: #1c212b;
        border: 1px solid var(--border);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        text-align: center;
      }
      .confirm-card h2 {
        margin: 0 0 6px;
        font-size: 1.05rem;
        font-weight: 650;
      }
      .confirm-card p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 0.88rem;
      }
      .confirm-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .confirm-actions button {
        padding: 12px 10px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 0.9rem;
        font-weight: 650;
        cursor: pointer;
      }
      .confirm-actions .yes {
        background: var(--danger);
        border-color: transparent;
        color: white;
      }
      .clip-player {
        display: grid;
        grid-template-columns: 40px 1fr auto;
        align-items: center;
        gap: 10px;
      }
      .clip-toggle {
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 50%;
        padding: 0;
        display: grid;
        place-items: center;
        background: #e35d6a;
        color: white;
        cursor: pointer;
      }
      .clip-toggle svg { width: 16px; height: 16px; }
      .clip-toggle .icon-pause { display: none; }
      .clip-toggle.is-playing .icon-play { display: none; }
      .clip-toggle.is-playing .icon-pause { display: block; }
      .clip-seek {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 28px;
        margin: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
      }
      .clip-seek::-webkit-slider-runnable-track {
        height: 6px;
        border-radius: 999px;
        background: #2a3140;
      }
      .clip-seek::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 16px;
        height: 16px;
        margin-top: -5px;
        border: 0;
        border-radius: 50%;
        background: #e8ecf4;
      }
      .clip-seek::-moz-range-track {
        height: 6px;
        border: 0;
        border-radius: 999px;
        background: #2a3140;
      }
      .clip-seek::-moz-range-thumb {
        width: 16px;
        height: 16px;
        border: 0;
        border-radius: 50%;
        background: #e8ecf4;
      }
      .clip-time {
        min-width: 2.6em;
        text-align: right;
        color: var(--muted);
        font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
      }
      .item audio { display: none; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="app">
      <button id="moreBtn" class="more-btn" type="button" aria-label="Microphone" aria-expanded="false" aria-controls="micMenu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="5" r="1.8" fill="currentColor"></circle>
          <circle cx="12" cy="12" r="1.8" fill="currentColor"></circle>
          <circle cx="12" cy="19" r="1.8" fill="currentColor"></circle>
        </svg>
      </button>
      <div id="micMenu" class="mic-menu hidden">
        <label>
          Microphone
          <select id="micSelect"></select>
        </label>
      </div>

      <div class="record-wrap">
        <button id="recordBtn" class="record-btn" type="button" aria-label="Start recording">
          <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3"></rect>
            <path d="M6 11a6 6 0 0 0 12 0"></path>
            <path d="M12 17v4"></path>
            <path d="M8 21h8"></path>
          </svg>
          <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"></rect>
          </svg>
        </button>
        <p id="timer" class="record-time"></p>
        <canvas id="wave" class="wave" aria-label="Microphone signal"></canvas>
        <p id="recordHint" class="record-hint">Tap to record</p>
        <p class="status" id="recStatus">Ready.</p>
      </div>

      <section id="listCard" class="clips">
        <p class="panel-title">On this phone</p>
        <ul id="list" class="phone-list"></ul>
      </section>
    </div>

    <div id="deleteOverlay" class="confirm-overlay hidden">
      <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="deleteTitle">
        <h2 id="deleteTitle">Delete this recording?</h2>
        <p id="deleteSub"></p>
        <div class="confirm-actions">
          <button type="button" id="deleteCancel">Cancel</button>
          <button type="button" id="deleteYes" class="yes">Delete</button>
        </div>
      </div>
    </div>

    <script type="module">
      const micSelect = document.getElementById("micSelect");
      const moreBtn = document.getElementById("moreBtn");
      const micMenu = document.getElementById("micMenu");
      const waveCanvas = document.getElementById("wave");
      const waveCtx = waveCanvas.getContext("2d");
      const recStatus = document.getElementById("recStatus");
      const recordBtn = document.getElementById("recordBtn");
      const recordHint = document.getElementById("recordHint");
      const timerEl = document.getElementById("timer");
      const listEl = document.getElementById("list");
      const deleteOverlay = document.getElementById("deleteOverlay");
      const deleteSub = document.getElementById("deleteSub");

      let mediaRecorder = null;
      let chunks = [];
      let timer = null;
      let startedAt = 0;
      let audioContext = null;
      let monitorStream = null;
      let monitorContext = null;
      let meterRaf = null;
      let monitorToken = 0;
      let waveProcessor = null;
      const WAVE_SLOTS = 56;
      let waveSamples = new Array(WAVE_SLOTS).fill(0);
      let captureStreams = [];
      const recordings = [];
      let pendingDelete = null;

      function closeDelete() {
        pendingDelete = null;
        deleteOverlay.classList.add("hidden");
      }

      deleteOverlay.addEventListener("click", (event) => {
        if (event.target === deleteOverlay) closeDelete();
      });
      document.getElementById("deleteCancel").addEventListener("click", closeDelete);
      document.getElementById("deleteYes").addEventListener("click", () => {
        const pending = pendingDelete;
        if (!pending) return;
        closeDelete();
        pending.audio.pause();
        URL.revokeObjectURL(pending.item.url);
        URL.revokeObjectURL(pending.saveHref);
        const index = recordings.indexOf(pending.item);
        if (index >= 0) recordings.splice(index, 1);
        renderList();
        forgetRecording(pending.item.id).catch((err) => setText(err.message || String(err), "error"));
      });

      function newId() {
        return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
      }

      function openDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open("audio-recorder", 1);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains("recordings")) {
              db.createObjectStore("recordings", { keyPath: "id" });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      async function rememberRecording(item) {
        const db = await openDb();
        await new Promise((resolve, reject) => {
          const tx = db.transaction("recordings", "readwrite");
          tx.objectStore("recordings").put({
            id: item.id,
            name: item.name,
            at: item.at.getTime(),
            blob: item.blob,
          });
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
        db.close();
      }

      async function forgetRecording(id) {
        const db = await openDb();
        await new Promise((resolve, reject) => {
          const tx = db.transaction("recordings", "readwrite");
          tx.objectStore("recordings").delete(id);
          tx.oncomplete = () => resolve();
          tx.onerror = () => reject(tx.error);
        });
        db.close();
      }

      async function loadSavedRecordings() {
        const db = await openDb();
        const rows = await new Promise((resolve, reject) => {
          const request = db.transaction("recordings", "readonly").objectStore("recordings").getAll();
          request.onsuccess = () => resolve(request.result || []);
          request.onerror = () => reject(request.error);
        });
        db.close();
        rows.sort((a, b) => b.at - a.at);
        recordings.length = 0;
        for (const row of rows) {
          recordings.push({
            id: row.id,
            name: row.name,
            blob: row.blob,
            at: new Date(row.at),
            url: URL.createObjectURL(row.blob),
          });
        }
        renderList();
      }
      const canDisplayMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getDisplayMedia);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const isPhone = isIOS || /Android|Mobile/i.test(navigator.userAgent);

      function setText(msg, kind) {
        recStatus.textContent = msg;
        recStatus.className = "status " + (kind || "");
      }

      function fmt(ms) {
        const s = Math.floor(ms / 1000);
        return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
      }

      function stampFrom(d) {
        const p = (n) => String(n).padStart(2, "0");
        return (
          d.getFullYear() +
          "-" +
          p(d.getMonth() + 1) +
          "-" +
          p(d.getDate()) +
          "-" +
          p(d.getHours()) +
          p(d.getMinutes()) +
          p(d.getSeconds())
        );
      }

      function stamp() {
        return stampFrom(new Date());
      }

      function pickMime() {
        const types = isPhone
          ? ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"]
          : ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
        return types.find((t) => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
      }

      async function loadMics() {
        try {
          const temp = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
          temp.getTracks().forEach((t) => t.stop());
        } catch {
          // list whatever is already permitted
        }
        const devices = await navigator.mediaDevices.enumerateDevices();
        const mics = devices.filter((d) => d.kind === "audioinput");
        const earpiece = mics.find((m) => isHeadsetEarpiece(m.label));
        const ordered = earpiece ? [earpiece, ...mics.filter((m) => m !== earpiece)] : mics;
        micSelect.innerHTML = "";
        for (const mic of ordered) {
          const opt = document.createElement("option");
          opt.value = mic.deviceId;
          opt.textContent = mic.label || "Microphone";
          if (mic === earpiece) opt.selected = true;
          micSelect.appendChild(opt);
        }
        if (!mics.length) {
          const opt = document.createElement("option");
          opt.value = "";
          opt.textContent = "Default microphone";
          micSelect.appendChild(opt);
        }
        if (earpiece) micSelect.value = earpiece.deviceId;
        await startMonitor();
      }

      function isHeadsetEarpiece(label) {
        const name = (label || "").toLowerCase().replace(/[^a-z]+/g, " ");
        return name.includes("headset") && name.includes("earpiece");
      }

      async function openMic() {
        const deviceId = micSelect.value ? { exact: micSelect.value } : undefined;
        const attempts = [
          {
            deviceId,
            echoCancellation: { exact: false },
            noiseSuppression: { exact: false },
            autoGainControl: { exact: false },
            voiceIsolation: { exact: false },
            channelCount: { ideal: 1 },
            sampleRate: { ideal: 48000 },
            sampleSize: { ideal: 16 },
          },
          {
            deviceId,
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            channelCount: { ideal: 1 },
            sampleRate: { ideal: 48000 },
          },
        ];
        let lastErr = null;
        for (const audio of attempts) {
          try {
            return await navigator.mediaDevices.getUserMedia({ audio, video: false });
          } catch (err) {
            lastErr = err;
            if (err.name !== "OverconstrainedError" && err.name !== "ConstraintError") throw err;
          }
        }
        throw lastErr || new Error("Could not open the microphone");
      }

      function drawWave() {
        const dpr = window.devicePixelRatio || 1;
        const width = waveCanvas.clientWidth || 300;
        const height = waveCanvas.clientHeight || 84;
        const pixelsW = Math.floor(width * dpr);
        const pixelsH = Math.floor(height * dpr);
        if (waveCanvas.width !== pixelsW || waveCanvas.height !== pixelsH) {
          waveCanvas.width = pixelsW;
          waveCanvas.height = pixelsH;
        }
        waveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
        waveCtx.clearRect(0, 0, width, height);
        const mid = height / 2;
        const slot = width / WAVE_SLOTS;
        const gap = 3;
        const barW = Math.max(2, slot - gap);
        waveCtx.fillStyle = recordBtn.classList.contains("recording") ? "#e35d6a" : "#8b93a7";
        for (let i = 0; i < WAVE_SLOTS; i++) {
          const amp = Math.min(1, Math.abs(waveSamples[i]));
          const barH = Math.max(barW, amp * (height - 6));
          const x = i * slot + (slot - barW) / 2;
          waveCtx.fillRect(x, mid - barH / 2, barW, barH);
        }
        meterRaf = requestAnimationFrame(drawWave);
      }

      function startWaveLoop() {
        if (meterRaf) return;
        meterRaf = requestAnimationFrame(drawWave);
      }

      function pushWave(value) {
        waveSamples.copyWithin(0, 1);
        waveSamples[WAVE_SLOTS - 1] = value;
      }

      function attachWave(context, source) {
        if (waveProcessor) {
          waveProcessor.onaudioprocess = null;
          waveProcessor.disconnect();
          waveProcessor = null;
        }
        waveSamples = new Array(WAVE_SLOTS).fill(0);
        if (!context.createScriptProcessor) return;
        const processor = context.createScriptProcessor(2048, 1, 1);
        const silent = context.createGain();
        silent.gain.value = 0;
        source.connect(processor);
        processor.connect(silent);
        silent.connect(context.destination);
        processor.onaudioprocess = (event) => {
          const input = event.inputBuffer.getChannelData(0);
          let peak = 0;
          for (let i = 0; i < input.length; i++) {
            const sample = input[i];
            if (Math.abs(sample) > Math.abs(peak)) peak = sample;
          }
          pushWave(peak);
        };
        waveProcessor = processor;
      }

      async function startMonitor() {
        const token = ++monitorToken;
        if (waveProcessor) {
          waveProcessor.onaudioprocess = null;
          waveProcessor.disconnect();
          waveProcessor = null;
        }
        if (monitorStream) {
          monitorStream.getTracks().forEach((t) => t.stop());
          monitorStream = null;
        }
        if (monitorContext) {
          monitorContext.close().catch(() => {});
          monitorContext = null;
        }
        const stream = await openMic();
        if (token !== monitorToken) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        monitorStream = stream;
        monitorContext = new AudioContext();
        await monitorContext.resume();
        const source = monitorContext.createMediaStreamSource(stream);
        attachWave(monitorContext, source);
        startWaveLoop();
      }

      moreBtn.addEventListener("click", (event) => {
        event.stopPropagation();
        const open = micMenu.classList.toggle("hidden") === false;
        moreBtn.setAttribute("aria-expanded", open ? "true" : "false");
      });
      document.addEventListener("click", (event) => {
        if (micMenu.contains(event.target) || event.target === moreBtn) return;
        micMenu.classList.add("hidden");
        moreBtn.setAttribute("aria-expanded", "false");
      });

      micSelect.addEventListener("change", () => {
        if (mediaRecorder) return;
        startMonitor().catch((err) => setText(err.message, "error"));
      });
      document.addEventListener("pointerdown", () => {
        if (monitorContext && monitorContext.state === "suspended") monitorContext.resume();
      });

      async function getSystemAudioStream() {
        const displayStream = await navigator.mediaDevices.getDisplayMedia({
          video: { frameRate: 5, width: 320, height: 180 },
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            channelCount: { ideal: 2 },
            sampleRate: { ideal: 48000 },
            suppressLocalAudioPlayback: false,
          },
          systemAudio: "include",
        });
        const audio = displayStream.getAudioTracks()[0];
        if (!audio) {
          displayStream.getTracks().forEach((t) => t.stop());
          throw new Error("No device audio was shared. Turn on system audio for the whole screen.");
        }
        try { audio.contentHint = "music"; } catch { /* ignore */ }
        return displayStream;
      }

      function cleanupCapture() {
        if (timer) clearInterval(timer);
        timer = null;
        for (const stream of captureStreams) stream.getTracks().forEach((t) => t.stop());
        captureStreams = [];
        if (audioContext) {
          audioContext.close().catch(() => {});
          audioContext = null;
        }
        mediaRecorder = null;
        setRecordMode(false);
        micSelect.disabled = false;
        moreBtn.disabled = false;
      }

      let wakeLock = null;

      async function keepScreenOn(on) {
        if (!("wakeLock" in navigator)) return;
        if (!on) {
          if (wakeLock) {
            try { await wakeLock.release(); } catch { /* already released */ }
            wakeLock = null;
          }
          return;
        }
        try {
          wakeLock = await navigator.wakeLock.request("screen");
        } catch {
          wakeLock = null;
        }
      }

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && recordBtn.classList.contains("recording")) {
          keepScreenOn(true);
        }
      });

      function setRecordMode(on) {
        recordBtn.classList.toggle("recording", on);
        recordBtn.disabled = false;
        recordBtn.setAttribute("aria-label", on ? "Stop recording" : "Start recording");
        recordHint.textContent = on ? "Tap to stop" : "Tap to record";
        if (!on) timerEl.textContent = "";
        keepScreenOn(on);
      }

      async function toMp4(blob) {
        const mediabunny = await import("https://cdn.jsdelivr.net/npm/mediabunny@1.61.1/+esm");
        const aac = await import("https://cdn.jsdelivr.net/npm/@mediabunny/aac-encoder@1.61.1/+esm");
        aac.registerAacEncoder();

        const attempts = [
          {
            codec: "aac",
            numberOfChannels: 2,
            sampleRate: 48000,
            quality: new mediabunny.Quality({ bitrate: 256000 }),
          },
          {
            codec: "aac",
            numberOfChannels: 2,
            quality: new mediabunny.Quality("high"),
          },
          { codec: "aac" },
        ];

        for (const audio of attempts) {
          const input = new mediabunny.Input({
            source: new mediabunny.BlobSource(blob),
            formats: mediabunny.ALL_FORMATS,
          });
          const output = new mediabunny.Output({
            format: new mediabunny.Mp4OutputFormat(),
            target: new mediabunny.BufferTarget(),
          });
          const conversion = await mediabunny.Conversion.init({ input, output, audio });
          if (!conversion.isValid) continue;
          await conversion.execute();
          return new Blob([output.target.buffer], { type: "audio/mp4" });
        }
        throw new Error("This browser could not write an MP4.");
      }

      async function ensureVideoMp4(blob) {
        const mediabunny = await import("https://cdn.jsdelivr.net/npm/mediabunny@1.61.1/+esm");
        const aac = await import("https://cdn.jsdelivr.net/npm/@mediabunny/aac-encoder@1.61.1/+esm");
        aac.registerAacEncoder();

        const audioCtx = new AudioContext();
        let audioBuffer;
        try {
          audioBuffer = await audioCtx.decodeAudioData(await blob.arrayBuffer());
        } finally {
          audioCtx.close().catch(() => {});
        }
        const duration = Math.max(audioBuffer.duration || 0, 0.05);
        const canvas = document.createElement("canvas");
        canvas.width = 160;
        canvas.height = 160;
        const ctx = canvas.getContext("2d", { alpha: false });
        ctx.fillStyle = "#10131a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const output = new mediabunny.Output({
          format: new mediabunny.Mp4OutputFormat({ fastStart: "in-memory" }),
          target: new mediabunny.BufferTarget(),
        });
        const canvasSource = new mediabunny.CanvasSource(canvas, {
          codec: "avc",
          bitrate: new mediabunny.Quality("low"),
        });
        const audioSource = new mediabunny.AudioBufferSource({
          codec: "aac",
          bitrate: new mediabunny.Quality({ bitrate: 256000 }),
        });
        output.addVideoTrack(canvasSource);
        output.addAudioTrack(audioSource);
        await output.start();
        await canvasSource.add(0, duration);
        await audioSource.add(audioBuffer);
        await output.finalize();
        return new Blob([output.target.buffer], { type: "video/mp4" });
      }

      function fmtClock(seconds) {
        if (!Number.isFinite(seconds) || seconds < 0) return "0:00";
        const s = Math.floor(seconds);
        return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
      }

      function clipWhen(item) {
        const d = item.at instanceof Date ? item.at : new Date(item.when);
        if (Number.isNaN(d.getTime())) return { title: "Recording", sub: item.when || "" };
        return {
          title: d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }),
          sub: d.toLocaleDateString([], { month: "short", day: "numeric" }),
        };
      }

      function renderList() {
        listEl.innerHTML = "";
        if (!recordings.length) {
          const li = document.createElement("li");
          li.className = "item empty";
          li.textContent = "No recordings yet.";
          listEl.appendChild(li);
          return;
        }
        for (const item of recordings) {
          const label = clipWhen(item);
          const li = document.createElement("li");
          li.className = "item";
          const head = document.createElement("div");
          head.className = "clip-head";
          const titles = document.createElement("div");
          titles.className = "clip-titles";
          const title = document.createElement("p");
          title.className = "clip-title";
          title.textContent = "0:00";
          const sub = document.createElement("p");
          sub.className = "clip-sub";
          sub.textContent = label.sub;
          titles.append(title, sub);
          const save = document.createElement("a");
          save.className = "clip-save";
          save.href = URL.createObjectURL(new Blob([item.blob], { type: "application/octet-stream" }));
          save.download = item.name;
          save.textContent = "Download";
          save.addEventListener("click", () => setText("Downloading " + item.name + "…", "ok"));
          const del = document.createElement("button");
          del.type = "button";
          del.className = "clip-delete";
          del.setAttribute("aria-label", "Delete");
          del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>';
          del.addEventListener("click", () => {
            pendingDelete = { item, audio, saveHref: save.href };
            deleteSub.textContent = label.title + " · " + label.sub;
            deleteOverlay.classList.remove("hidden");
          });
          const actions = document.createElement("div");
          actions.className = "clip-actions";
          actions.append(save, del);
          head.append(titles, actions);

          const audio = document.createElement("audio");
          audio.preload = "metadata";
          audio.setAttribute("playsinline", "");
          audio.src = item.url;
          const player = document.createElement("div");
          player.className = "clip-player";
          const toggle = document.createElement("button");
          toggle.type = "button";
          toggle.className = "clip-toggle";
          toggle.setAttribute("aria-label", "Play");
          toggle.innerHTML = '<svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l12-7z"></path></svg><svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 5h4v14H6zm8 0h4v14h-4z"></path></svg>';
          const seek = document.createElement("input");
          seek.className = "clip-seek";
          seek.type = "range";
          seek.min = "0";
          seek.max = "1000";
          seek.value = "0";
          seek.setAttribute("aria-label", "Playback position");
          const time = document.createElement("span");
          time.className = "clip-time";
          time.textContent = "0:00";
          let seeking = false;
          toggle.addEventListener("click", () => {
            if (audio.paused) {
              document.querySelectorAll("audio").forEach((other) => {
                if (other !== audio) other.pause();
              });
              audio.play();
            } else {
              audio.pause();
            }
          });
          audio.addEventListener("play", () => {
            toggle.classList.add("is-playing");
            toggle.setAttribute("aria-label", "Pause");
          });
          audio.addEventListener("pause", () => {
            toggle.classList.remove("is-playing");
            toggle.setAttribute("aria-label", "Play");
          });
          const showTime = () => {
            const atStart = audio.paused && audio.currentTime < 0.05;
            time.textContent = fmtClock(atStart ? audio.duration : audio.currentTime);
          };
          const showDuration = () => {
            if (Number.isFinite(audio.duration)) title.textContent = fmtClock(audio.duration);
          };
          audio.addEventListener("loadedmetadata", () => {
            showDuration();
            showTime();
          });
          audio.addEventListener("durationchange", showDuration);
          if (audio.readyState >= 1) showDuration();
          audio.addEventListener("timeupdate", () => {
            if (!audio.duration) return;
            if (!seeking) seek.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
            showTime();
          });
          audio.addEventListener("ended", () => {
            seek.value = "0";
            time.textContent = fmtClock(audio.duration);
          });
          seek.addEventListener("pointerdown", () => { seeking = true; });
          seek.addEventListener("input", () => {
            if (!audio.duration) return;
            time.textContent = fmtClock((seek.value / 1000) * audio.duration);
          });
          seek.addEventListener("change", () => {
            if (audio.duration) audio.currentTime = (seek.value / 1000) * audio.duration;
            seeking = false;
          });
          player.append(toggle, seek, time);
          li.append(head, player, audio);
          listEl.appendChild(li);
        }
      }

      recordBtn.onclick = async () => {
        if (mediaRecorder && mediaRecorder.state !== "inactive") {
          mediaRecorder.stop();
          return;
        }
        if (mediaRecorder) return;
        try {
          recordBtn.disabled = true;
          setText("Starting…");
          if (!monitorStream || monitorStream.getAudioTracks().every((t) => t.readyState !== "live")) {
            await startMonitor();
          }
          const micStream = monitorStream;
          if (!micStream) throw new Error("Could not open the microphone");

          let systemStream = null;
          if (!isPhone && canDisplayMedia) {
            try {
              setText("Share audio if you want device sound…");
              systemStream = await getSystemAudioStream();
              captureStreams.push(systemStream);
            } catch (err) {
              console.warn(err);
            }
          }

          let recordStream = micStream;
          if (!isPhone) {
            audioContext = new AudioContext();
            await audioContext.resume();
            const dest = audioContext.createMediaStreamDestination();
            dest.channelCount = 2;
            dest.channelCountMode = "explicit";
            dest.channelInterpretation = "discrete";
            const micSource = audioContext.createMediaStreamSource(micStream);
            micSource.connect(dest);
            if (systemStream) {
              const deskSource = audioContext.createMediaStreamSource(systemStream);
              deskSource.channelCount = 2;
              deskSource.channelCountMode = "explicit";
              deskSource.channelInterpretation = "discrete";
              deskSource.connect(dest);
            }
            recordStream = dest.stream;
          }

          chunks = [];
          const mime = pickMime();
          const recorderOptions = {};
          if (mime) recorderOptions.mimeType = mime;
          if (!isPhone) recorderOptions.audioBitsPerSecond = 512000;
          else if (mime.includes("mp4")) recorderOptions.audioBitsPerSecond = 256000;
          mediaRecorder = new MediaRecorder(recordStream, Object.keys(recorderOptions).length ? recorderOptions : undefined);
          mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size) chunks.push(e.data);
          };
          mediaRecorder.onstop = async () => {
            const raw = new Blob(chunks, { type: mediaRecorder?.mimeType || mime || "audio/webm" });
            cleanupCapture();
            if (!raw.size) {
              setText("Recording was empty.", "error");
              return;
            }
            const alreadyMp4 = (raw.type || mime || "").includes("mp4");
            setText("Making MP4…");
            try {
              const mp4 = isPhone
                ? await ensureVideoMp4(raw)
                : (alreadyMp4 ? new Blob([raw], { type: "audio/mp4" }) : await toMp4(raw));
              const item = {
                id: newId(),
                name: "recording-" + stamp() + ".mp4",
                blob: mp4,
                url: URL.createObjectURL(mp4),
                at: new Date(),
              };
              recordings.unshift(item);
              renderList();
              await rememberRecording(item);
              setText("Ready.");
            } catch (err) {
              setText(err.message || String(err), "error");
            }
          };
          if (isPhone) mediaRecorder.start();
          else mediaRecorder.start(1000);
          startedAt = Date.now();
          timerEl.textContent = "00:00";
          setRecordMode(true);
          micSelect.disabled = true;
          moreBtn.disabled = true;
          micMenu.classList.add("hidden");
          moreBtn.setAttribute("aria-expanded", "false");
          timer = setInterval(() => {
            timerEl.textContent = fmt(Date.now() - startedAt);
          }, 250);
          setText(systemStream ? "Recording mic + device audio." : "Recording.", "ok");
        } catch (err) {
          cleanupCapture();
          setText(err.message, "error");
        }
      };

      startWaveLoop();
      loadSavedRecordings().catch((err) => setText(err.message || String(err), "error"));
      loadMics().catch((err) => setText(err.message, "error"));
    </script>
  </body>
</html>
